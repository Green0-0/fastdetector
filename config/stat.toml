human_column = "original"
ai_column = "final_response"
parallelization_type = "data"

# True means the metric will be calculated
# For embeddings/llms, specifying false will skip using the model altogether
jaccards_1 = true
jaccards_2 = true
jaccards_3 = false
levenshteins = true

moverscore = true
bertscore = true
pairwise_cosim = true
pairwise_softngram = true

perplexity = true
entropy = true
topp_outlier = true
topk_outlier = true
binoculars_score = true
fastdetectgpt_score = true
reranker_score = true
threshold_type = "accuracy"

# Thresholds for the outlier metrics. ``topk_threshold`` MUST be
# ``<= top_logprobs_k`` or the top-k outlier metric returns NaN for
# every text (the k-th largest logprob cannot be computed).
topp_threshold = 0.95
topk_threshold = 50

# If set to true, embedding and logprob matrices will be deleted after use
remove_columns_afterwards = true

# These define the models used for specific metrics
softngram_model = "all-MiniLM-L6-v2"
embedding_model = "Qwen/Qwen3-Embedding-4B"
token_embedding_model = "answerdotai/ModernBERT-base"
reranker_model = "Qwen/Qwen3-Reranker-4B"
batch_size = 4

llm_checkpoints = [
    "unsloth/Llama-3.2-3B-Instruct",
    "unsloth/Llama-3.2-3B"
]
col_suffixes = ["_llama_instruct", "_llama_base"]
top_logprobs_k = 100

# Vocabulary size of the model(s) serving logprobs. Used by the tail-mass
# heuristic in entropies_approx / fastdetectgpt_scores_approx to estimate
# the entropy / variance contribution of the probability mass outside the
# top-N logprobs. Leave commented / null to use the old concentrated-tail
# lower bound (which underestimates entropy and inflates FastDetectGPT
# score magnitude). Uncomment and set to your model's vocab size for
# unbiased estimation.
# Llama-3.2 vocab = 128256
# llm_vocab_size = 128256
