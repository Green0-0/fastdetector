[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastdetector"
version = "0.1.0"
description = "AI-generated text detection toolkit: filter, rewrite, compute statistics, and evaluate classifiers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "huggingface-hub>=1.14.0",
    "openai>=1.30.0",
    "levenshtein>=0.25.0",
    "sentence-transformers>=3.0.0",
    "transformers>=5.0.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "matplotlib",
    "torch>=2.12.0",
    "emoji>=2.15.0",
    "unidecode>=1.4.0",
    "pot>=0.9.6.post1",
    "accelerate>=1.13.0",
    "peft>=0.19.1",
    "bitsandbytes>=0.49.2",
    "pydantic>=2.13.4",
    "langdetect>=1.0.9",
    "pytest>=9.1.1",
    "optuna>=4.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "scripts" and "scripts/stats" make the CLI entry points importable so their
# pure helpers (post-processing, compute plans, readme building) can be tested
# without running the pipelines.
pythonpath = ["src", "scripts", "scripts/stats"]
# Expensive tiers are deselected by default so a bare `pytest` is safe to run
# on a laptop. A `-m` on the command line REPLACES this one, so
# `pytest -m gpu` runs exactly the GPU tier.
addopts = "--strict-markers --strict-config -m 'not gpu and not slow and not network and not vllm'"
markers = [
    "gpu: requires a CUDA device (auto-skipped when none is visible)",
    "slow: takes more than a few seconds",
    "network: downloads from the HF Hub or otherwise needs the internet",
    "bigmem: needs a lot of host RAM (see the test for the amount)",
    "vllm: boots the real engine binary (auto-skipped when the engine venv is not populated)",
]
