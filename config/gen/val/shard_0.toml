source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "aphrodite"
model_name = "TheBloke/Mixtral-8x7B-Instruct-v0.1-AWQ"
parallelization_type = "tensor"
temperature = 0.7
top_p = 0.95
top_k = 40
repetition_penalty = 1.1
disable_thinking = true
max_model_len = 32000
max_input_len = 15000
