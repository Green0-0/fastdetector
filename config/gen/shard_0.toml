num_samples = 50000
source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "vllm"
model_name = "cyankiwi/granite-4.1-8b-AWQ-INT4"
parallelization_type = "data"
temperature = 0.6
top_p = 0.9
top_k = 40
disable_thinking = false
presence_penalty = 1.5
max_model_len = 32000
max_input_len = 15000