columns_to_score = ["original", "final_response"]

# Maximum tokens per text; longer texts are truncated.
max_model_len = 16000

# Cap on padded tokens (batch_size * max_len) per forward pass.
max_batch_tokens = 16384

# Positions per LM-head/log-softmax reduction chunk. Peak activation memory
# scales with head_chunk_size * vocab_size (per co-resident model).
head_chunk_size = 512

dtype = "bfloat16"

# "auto" replicates the checkpoint(s) onto every visible CUDA device and
# scores this run's dataset shard on all of them in parallel; use an explicit
# list like ["cuda:0", "cuda:1"] to select specific GPUs.
devices = "auto"
# attn_implementation = "sdpa"  # default: try flash_attention_2, fall back to sdpa

perplexity = true
entropy = true
topp_outlier = true
topk_outlier = true
binoculars_score = true
fastdetectgpt_score = true

topp_threshold = 0.95
topk_threshold = 50

# With binoculars enabled, the first checkpoint is the observer and the
# second the performer; both must share a tokenizer/vocab.
llm_checkpoints = [
    "unsloth/Llama-3.2-3B-Instruct",
    "unsloth/Llama-3.2-3B"
]
col_suffixes = ["_llama_instruct", "_llama_base"]
