prompt_metadata_column = "prompt"
model_metadata_column = "generator_model"

topic_column = "topic"
format_column = "format"

base_columns = ["original", "final_response"]
fixed_classes = [false, true]
# auto_class_column = "label" # Automatically determine the class using the value from this column
# ai_label = "AI" # The string value that indicates the AI class

distance_metrics = [
    "jaccard_1",
    "jaccard_2",
    "jaccard_3",
    "levenshtein",
    "softngram",
    "cosdist",
    "bertscore",
    "bertscore_precision",
    "bertscore_recall",
    "moverscore",
    "reranker"
]

# Each detector's TPR is also traced as AI rows below a rising minimum of this
# distance are dropped (human rows, and so the thresholds, are unchanged).
min_distance_metric = "cosdist"

