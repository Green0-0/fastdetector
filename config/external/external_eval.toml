# External scripts do NOT respect globals.toml, make sure you specifiy the dataset path
dataset_path = ""

# Optional HF datasets cache directory. Omit (or set to null) to use the HF
# default cache (~/.cache/huggingface/datasets).
# cache_dir = "/usr/project/xtmp/ccprocessing_cache/"

metadata_columns = ["prompt", "generator_model"]

base_model = "FacebookAI/roberta-large"
checkpoint = "pangram/editlens_roberta-large"
max_length = 512
batch_size = 24

# Instead of rows with paired human-AI responses
# This script expects a column of text and another column with the class
text_column = "original"
classification_column = "is_human"
default_class = "" # If a classification column is not included, instead assume all rows are in this class.

# Splits the test set into a small validation set to determine classification thresholds
validation_size = 0.1
threshold_type_bin = "f1"
threshold_type_score = "fpr_0_5pct"
# manual_threshold_score / manual_threshold_bin: omit (or set to null) to auto-derive
# from the validation sweep; set to a float to force a manual threshold.
