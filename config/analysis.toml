direction = "lower_is_ai"

[[classifiers]]
name = "Top-p Outliers (Llama-3.2-3B-Instruct)"
suffix = "_topp_outlier_llama_instruct"
threshold_type = "fpr_0_5pct"
direction = "lower_is_ai"

[[classifiers]]
name = "Top-p Outliers (Llama-3.2-3B)"
suffix = "_topp_outlier_llama_base"
