source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "anthropic_aws"
model_name = "claude-opus-5"
parallelization_type = "none"

disable_thinking = true

batch = true
batch_state_dir = ".batch_state"
batch_poll_interval_secs = 300

aws_region = "us-east-1"

max_input_len = 15000
max_output_tokens = 16000
