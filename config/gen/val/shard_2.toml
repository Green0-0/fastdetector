source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "vllm"
model_name = "RedHatAI/Hy3-NVFP4-FP8"
parallelization_type = "pipeline"
temperature = 0.9
top_p = 1.0
top_k = -1
disable_thinking = true
chat_template_kwargs = { reasoning_effort = "no_think" }
gpu_memory_utilization = 0.97
max_model_len = 16384
max_input_len = 7000
