prompt_metadata_column = "prompt"
model_metadata_column = "generator_model"

base_model = "FacebookAI/roberta-large"
checkpoint = "pangram/editlens_roberta-large"
max_length = 512
batch_size = 24

# Splits the test set into a small validation set to determine classification thresholds
validation_size = 0.1
threshold_type_bin = "f1"
threshold_type_score = "fpr0.5"
# manual_threshold_score / manual_threshold_bin: omit (or set to null) to auto-derive
# from the validation sweep; set to a float to force a manual threshold.

# If the distance is below the lower bound, the row will be dropped
filter_type = "AND"

[[filter_conditions]]
column = "pairwise_cosdist_original_final_response"
operator = ">="
value = 0.03

[[filter_conditions]]
column = "pairwise_softngram_original_final_response"
operator = ">="
value = 0.06

# Distance metrics to plot in README
distance_metrics = [
    "pairwise_cosdist_original_final_response",
    "pairwise_softngram_original_final_response"
]