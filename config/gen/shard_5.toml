source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "vllm"
model_name = "deepseek-ai/DeepSeek-V4-Flash-0731"
parallelization_type = "tensor"
# DeepSeek-V4-Flash official: temperature=1.0, top_p=1.0 for non-agentic use
# (model card and the vLLM recipe). Non-think is the template default.
temperature = 1.0
top_p = 1.0
disable_thinking = false

gpu_memory_utilization = 0.97
max_model_len = 16384
max_input_len = 7000

tokenizer_mode = "deepseek_v4"
reasoning_parser = "deepseek_v4"
kv_cache_dtype = "fp8"
