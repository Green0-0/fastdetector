prompt_metadata_column = "prompt"
model_metadata_column = "generator_model"

validation_size = 0.1

filter_type = "OR"

base_columns = ["original", "final_response"]
fixed_classes = [false, true]
# auto_class_column = "label" # Automatically determine the class using the value from this column
# ai_label = "AI" # The string value that indicates the AI class

distance_metrics = [
    "jaccard_1",
    "jaccard_2",
    "jaccard_3",
    "levenshtein",
    "softngram",
    "cosdist",
    "bertscore",
    "bertscore_precision",
    "bertscore_recall",
    "moverscore",
    "reranker"
]

[[filter_conditions]]
column = "cosdist"
operator = ">="
value = 0.03

[[filter_conditions]]
column = "softngram"
operator = ">="
value = 0.06

[[classifiers]]
name = "EditLens Roberta-Large Score"
suffix = "_editlens_score_roberta_large"
threshold_type = "fpr_0_5pct"

[[classifiers]]
name = "EditLens Roberta-Large Bucket"
suffix = "_editlens_bucket_roberta_large"
threshold_type = "f1"

[[classifiers]]
name = "Perplexity (Llama-3.2-3B-Instruct)"
suffix = "_perplexity_llama_instruct"
threshold_type = "fpr_0_5pct"
direction = "lower_is_ai"

[[classifiers]]
name = "Perplexity (Llama-3.2-3B)"
suffix = "_perplexity_llama_base"
threshold_type = "fpr_0_5pct"
direction = "lower_is_ai"

[[classifiers]]
name = "Entropy (Llama-3.2-3B-Instruct)"
