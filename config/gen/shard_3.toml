source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "vllm"
model_name = "mistralai/Mistral-Small-4-119B-2603-NVFP4"
parallelization_type = "tensor"
temperature = 0.6
top_p = 0.9
top_k = 40
disable_thinking = false
presence_penalty = 1.5
max_model_len = 32000
max_input_len = 15000

# This checkpoint ships Mistral's native "consolidated" layout (params.json /
# tekken.json) with no HuggingFace config.json, so all three have to be told.
tokenizer_mode = "mistral"
config_format = "mistral"
load_format = "mistral"
