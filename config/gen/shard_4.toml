source_column = "collected_subset"
prompt_file = "prompts/combined_dataset_test.json"

[pipeline]
engine = "vllm"
model_name = "RedHatAI/Hy3-NVFP4-FP8"
parallelization_type = "pipeline"
# Hy3 official: temperature=0.9, top_p=1.0 (tencent/Hy3 model card and
# generation_config.json, which also pins top_k=-1).
temperature = 0.9
top_p = 1.0
top_k = -1
disable_thinking = false

gpu_memory_utilization = 0.97
max_model_len = 16384
max_input_len = 7000